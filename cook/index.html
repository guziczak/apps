<script>
    function logElement(elementName, element) {
        if (!element) console.error(`Element ${elementName} nie został znaleziony`);
        return element;
    }

    /**
     * Klasa zarządzająca danymi aplikacji
     */
    class RecipeModel {
        constructor() {
            this.recipes = [];
            this.categories = [];
            this.currentCategory = null;
            this.currentRecipe = null;
            this.recentRecipes = this.loadJSON('recentRecipes', []);
            this.favorites = this.loadJSON('favorites', []);
            this.shoppingList = this.loadJSON('shoppingList', []);
            this.searchResults = null;
            this.isLoading = false;

            this.darkMode = localStorage.getItem('darkMode') === 'true';
        }

        loadJSON(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v ? JSON.parse(v) : fallback;
            } catch {
                return fallback;
            }
        }

        saveJSON(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (error) {
                console.error(`Błąd zapisu ${key}:`, error);
            }
        }

        toggleFavorite(recipeId) {
            const idx = this.favorites.indexOf(recipeId);
            if (idx >= 0) this.favorites.splice(idx, 1);
            else this.favorites.push(recipeId);
            this.saveJSON('favorites', this.favorites);
            return idx < 0;
        }

        isFavorite(recipeId) {
            return this.favorites.includes(recipeId);
        }

        getFavoriteRecipes() {
            return this.favorites
                .map(id => this.recipes.find(r => r.id === id))
                .filter(Boolean);
        }

        addToShoppingList(recipeId, ingredients) {
            const recipe = this.recipes.find(r => r.id === recipeId);
            const recipeTitle = recipe ? recipe.title : '';
            ingredients.forEach(ing => {
                this.shoppingList.push({
                    id: `${recipeId}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    recipeId,
                    recipeTitle,
                    amount: ing.amount || '',
                    name: ing.name || '',
                    checked: false
                });
            });
            this.saveJSON('shoppingList', this.shoppingList);
        }

        toggleShoppingItem(itemId) {
            const item = this.shoppingList.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                this.saveJSON('shoppingList', this.shoppingList);
            }
        }

        removeShoppingItem(itemId) {
            this.shoppingList = this.shoppingList.filter(i => i.id !== itemId);
            this.saveJSON('shoppingList', this.shoppingList);
        }

        clearShoppingList() {
            this.shoppingList = [];
            this.saveJSON('shoppingList', this.shoppingList);
        }

        clearCheckedShopping() {
            this.shoppingList = this.shoppingList.filter(i => !i.checked);
            this.saveJSON('shoppingList', this.shoppingList);
        }

        /**
         * Ładuje przepisy z pliku JSON
         */
        async loadRecipes() {
            try {
                this.isLoading = true;
                const response = await fetch('recipes.json');

                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('Nieprawidłowy format pliku recipes.json — oczekiwano tablicy.');
                }

                this.recipes = data.map(row => ({
                    id: row.id,
                    title: row.title || '',
                    category: row.category || '',
                    prepTime: row.prepTime ?? 0,
                    servings: row.servings ?? 0,
                    ingredients: Array.isArray(row.ingredients) ? row.ingredients : [],
                    instructions: Array.isArray(row.instructions) ? row.instructions : []
                }));

                this.createCategoryList();
                return this.recipes;
            } catch (error) {
                console.error('Błąd podczas wczytywania przepisów:', error);
                throw error;
            } finally {
                this.isLoading = false;
            }
        }

        /**
         * Tworzy listę kategorii na podstawie przepisów
         */
        createCategoryList() {
            const categoriesSet = new Set(this.recipes.map(recipe => recipe.category));

            this.categories = Array.from(categoriesSet)
                .filter(Boolean) // Usuwa puste wartości
                .map(category => ({
                    name: category,
                    count: this.recipes.filter(recipe => recipe.category === category).length
                }));

            // Sortowanie kategorii alfabetycznie
            this.categories.sort((a, b) => a.name.localeCompare(b.name));
        }

        /**
         * Zwraca przepisy według kategorii
         */
        getRecipesByCategory(category) {
            this.currentCategory = category;
            return this.recipes.filter(recipe => recipe.category === category);
        }

        /**
         * Zwraca przepis według id
         */
        getRecipeById(id) {
            return this.recipes.find(recipe => recipe.id === id);
        }

        /**
         * Dodaje przepis do ostatnio przeglądanych
         */
        addToRecentRecipes(recipe) {
            if (!recipe) return;

            // Usuwanie duplikatów
            this.recentRecipes = this.recentRecipes.filter(r => r.id !== recipe.id);

            // Dodawanie na początek listy
            this.recentRecipes.unshift({
                id: recipe.id,
                title: recipe.title,
                category: recipe.category
            });

            // Ograniczenie do 5 ostatnich
            if (this.recentRecipes.length > 5) {
                this.recentRecipes.pop();
            }

            // Zapisanie do local storage
            this.saveRecentToStorage();
        }

        saveRecentToStorage() {
            this.saveJSON('recentRecipes', this.recentRecipes);
        }

        /**
         * Wyszukuje przepisy według zapytania
         */
        searchRecipes(query) {
            if (!query || query.length < 2) {
                this.searchResults = null;
                return null;
            }

            const queryLower = query.toLowerCase().trim();
            const searchWords = queryLower.split(/\s+/).filter(word => word.length > 0);

            if (searchWords.length === 0) {
                this.searchResults = null;
                return null;
            }

            // Informacja o krótkich słowach
            const shortWords = searchWords.filter(word => word.length === 1);

            const exactMatches = [];
            const partialMatches = [];

            this.recipes.forEach(recipe => {
                const titleLower = recipe.title.toLowerCase();
                const categoryLower = recipe.category ? recipe.category.toLowerCase() : '';

                // Informacje o dopasowaniu
                const matchInfo = {
                    matchedTitle: false,
                    matchedCategory: false,
                    matchedWords: [],
                    matchedIngredients: [],
                    matchedInstructions: []
                };

                // Sprawdzanie dokładnego dopasowania frazy
                if (titleLower.includes(queryLower) || categoryLower.includes(queryLower)) {
                    matchInfo.matchedTitle = titleLower.includes(queryLower);
                    matchInfo.matchedCategory = categoryLower.includes(queryLower);
                    matchInfo.matchedWords = [...searchWords];

                    exactMatches.push({
                        recipe,
                        relevance: matchInfo.matchedTitle ? 1.0 : 0.9,
                        matchInfo
                    });
                    return;
                }

                // Sprawdzanie dopasowania poszczególnych słów
                const matchedWords = new Set();

                // Sprawdzanie w tytule i kategorii
                for (const word of searchWords) {
                    if (titleLower.includes(word)) {
                        matchedWords.add(word);
                        matchInfo.matchedTitle = true;
                    }
                    if (categoryLower.includes(word)) {
                        matchedWords.add(word);
                        matchInfo.matchedCategory = true;
                    }
                }

                // Sprawdzanie w składnikach
                for (const word of searchWords) {
                    for (const ingredient of recipe.ingredients || []) {
                        const ingredientName = ingredient.name ? ingredient.name.toLowerCase() : '';
                        if (ingredientName.includes(word)) {
                            matchedWords.add(word);
                            matchInfo.matchedIngredients.push({
                                ingredient: ingredient.name,
                                searchWord: word
                            });
                            break;
                        }
                    }
                }

                // Sprawdzanie w instrukcjach
                for (const word of searchWords) {
                    for (let i = 0; i < (recipe.instructions || []).length; i++) {
                        const instruction = recipe.instructions[i].toLowerCase();
                        if (instruction.includes(word)) {
                            matchedWords.add(word);
                            matchInfo.matchedInstructions.push({
                                instructionIndex: i,
                                instruction: recipe.instructions[i],
                                searchWord: word
                            });
                            break;
                        }
                    }
                }

                // Konwersja zbioru na tablicę
                matchInfo.matchedWords = [...matchedWords];

                // Klasyfikacja wyników
                if (matchInfo.matchedWords.length === searchWords.length) {
                    // Wszystkie słowa znalezione
                    let relevanceScore = 0.7;
                    if (matchInfo.matchedTitle) relevanceScore += 0.2;
                    if (matchInfo.matchedCategory) relevanceScore += 0.1;

                    exactMatches.push({
                        recipe,
                        relevance: Math.min(1.0, relevanceScore),
                        matchInfo
                    });
                } else if (matchInfo.matchedWords.length > 0) {
                    // Częściowe dopasowanie
                    const relevanceScore = 0.3 + (matchInfo.matchedWords.length / searchWords.length * 0.5);

                    partialMatches.push({
                        recipe,
                        relevance: relevanceScore,
                        matchInfo
                    });
                }
            });

            // Sortowanie wyników wg trafności
            exactMatches.sort((a, b) => b.relevance - a.relevance);
            partialMatches.sort((a, b) => b.relevance - a.relevance);

            this.searchResults = {
                query,
                exact: exactMatches,
                partial: partialMatches,
                totalCount: exactMatches.length + partialMatches.length,
                shortWords: shortWords.length > 0 ? shortWords : null
            };

            return this.searchResults;
        }

        /**
         * Przełącza motyw jasny/ciemny
         */
        toggleTheme() {
            this.darkMode = !this.darkMode;
            localStorage.setItem('darkMode', this.darkMode);
            return this.darkMode;
        }

        /**
         * Zapisuje informacje o aktualnie oglądanym przepisie na wypadek odświeżenia strony
         */
        saveCurrentRecipeForReload(recipe) {
            if (!recipe) return;

            try {
                // Zapisujemy ID i tytuł przepisu
                localStorage.setItem('lastViewedRecipeId', recipe.id);
                localStorage.setItem('lastViewedRecipeTitle', recipe.title);
                localStorage.setItem('lastViewedTimestamp', Date.now());
            } catch (error) {
                console.error('Błąd podczas zapisywania informacji o ostatnio oglądanym przepisie:', error);
            }
        }

        /**
         * Usuwa informacje o ostatnio oglądanym przepisie
         */
        clearLastViewedRecipe() {
            try {
                localStorage.removeItem('lastViewedRecipeId');
                localStorage.removeItem('lastViewedRecipeTitle');
                localStorage.removeItem('lastViewedTimestamp');
            } catch (error) {
                console.error('Błąd podczas usuwania informacji o ostatnio oglądanym przepisie:', error);
            }
        }

        /**
         * Sprawdza czy istnieje informacja o ostatnio oglądanym przepisie
         */
        checkForLastViewedRecipe() {
            try {
                const lastViewedRecipeId = localStorage.getItem('lastViewedRecipeId');
                const lastViewedRecipeTitle = localStorage.getItem('lastViewedRecipeTitle');
                const lastViewedTimestamp = localStorage.getItem('lastViewedTimestamp');

                // Sprawdzamy czy dane istnieją i czy nie minęło zbyt dużo czasu (np. 30 minut)
                if (lastViewedRecipeId && lastViewedRecipeTitle && lastViewedTimestamp) {
                    const now = Date.now();
                    const timeSinceLastView = now - parseInt(lastViewedTimestamp);

                    // Jeśli minęło mniej niż 30 minut
                    if (timeSinceLastView < 30 * 60 * 1000) {
                        return {
                            id: parseInt(lastViewedRecipeId),
                            title: lastViewedRecipeTitle
                        };
                    }
                }

                return null;
            } catch (error) {
                console.error('Błąd podczas sprawdzania ostatnio oglądanego przepisu:', error);
                return null;
            }
        }
    }

    /**
     * Klasa zarządzająca interfejsem użytkownika
     */
    class RecipeView {
        constructor() {
            // Stan widoku
            this.isLoading = false;

            // Potrzebne referencje elementów
            this.elements = {};

            // Flaga określająca czy elementy są już zainicjalizowane
            this.isInitialized = false;
        }

        /**
         * Inicjalizuje elementy DOM
         */
        initialize() {
            if (this.isInitialized) return true;

            console.log("Inicjalizacja elementów widoku...");

            // Elementy UI
            this.elements = {
                appContainer: logElement('appContainer', document.getElementById('appContainer')),
                contentWrapper: logElement('contentWrapper', document.getElementById('contentWrapper')),
                mainContainer: logElement('mainContainer', document.getElementById('mainContainer')),
                loader: logElement('loader', document.getElementById('loader')),
                categoryList: logElement('categoryList', document.getElementById('categoryList')),
                recentList: logElement('recentList', document.getElementById('recentList')),
                favoritesList: logElement('favoritesList', document.getElementById('favoritesList')),
                favoritesLink: logElement('favoritesLink', document.getElementById('favoritesLink')),
                shoppingListLink: logElement('shoppingListLink', document.getElementById('shoppingListLink')),
                favoritesBadge: logElement('favoritesBadge', document.getElementById('favoritesBadge')),
                shoppingBadge: logElement('shoppingBadge', document.getElementById('shoppingBadge')),
                searchInput: logElement('searchInput', document.getElementById('searchInput')),
                sidebar: logElement('sidebar', document.getElementById('sidebar')),
                logo: logElement('logo', document.getElementById('logo')),
                themeToggle: logElement('themeToggle', document.getElementById('themeToggle')),
                mobileMenuToggle: logElement('mobileMenuToggle', document.getElementById('mobileMenuToggle')),
                sidebarClose: logElement('sidebarClose', document.getElementById('sidebarClose')),
                notification: logElement('notification', document.getElementById('notification'))
            };

            // Sprawdzenie czy wszystkie elementy zostały znalezione
            const allElementsFound = Object.values(this.elements).every(el => el !== null);

            if (allElementsFound) {
                console.log("Wszystkie elementy zostały znalezione");
                this.isInitialized = true;
                return true;
            } else {
                console.error("Nie wszystkie elementy zostały znalezione");
                return false;
            }
        }

        /**
         * Inicjalizacja menu mobilnego
         */
        initMobileMenu() {
            if (!this.isInitialized) {
                console.error("Próba inicjalizacji menu mobilnego bez zainicjalizowanych elementów");
                return;
            }

            console.log("Inicjalizacja menu mobilnego...");

            if (this.elements.mobileMenuToggle) {
                this.elements.mobileMenuToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.elements.sidebar.classList.add('open');
                    document.body.style.overflow = 'hidden';
                    console.log('Menu mobilne otwarte');
                });
            }

            if (this.elements.sidebarClose) {
                this.elements.sidebarClose.addEventListener('click', () => {
                    this.elements.sidebar.classList.remove('open');
                    document.body.style.overflow = 'auto';
                    console.log('Menu mobilne zamknięte przez przycisk zamykania');
                });
            }

            // Zamykanie menu po kliknięciu poza panelem
            document.addEventListener('click', (e) => {
                if (this.elements.sidebar.classList.contains('open') &&
                    !this.elements.sidebar.contains(e.target) &&
                    e.target !== this.elements.mobileMenuToggle) {
                    this.elements.sidebar.classList.remove('open');
                    document.body.style.overflow = 'auto';
                    console.log('Menu mobilne zamknięte przez kliknięcie poza panelem');
                }
            });

            console.log("Inicjalizacja menu mobilnego zakończona");
        }

        /**
         * Pokazuje/ukrywa loader w zależności od stanu ładowania
         */
        setLoading(isLoading) {
            if (!this.isInitialized) {
                console.warn("Próba ustawienia loadera bez zainicjalizowanych elementów");
                return;
            }

            this.isLoading = isLoading;
            if (isLoading) {
                this.elements.loader.style.display = 'block';
                this.elements.mainContainer.style.display = 'none';
            } else {
                this.elements.loader.style.display = 'none';
                this.elements.mainContainer.style.display = 'block';
            }
        }

        /**
         * Pokazuje powiadomienie z wiadomością
         */
        showNotification(message, type = 'info', duration = 3000) {
            if (!this.isInitialized) {
                console.warn("Próba pokazania powiadomienia bez zainicjalizowanych elementów");
                return;
            }

            const notification = this.elements.notification;
            const icon = notification.querySelector('.notification-icon i');
            const messageEl = notification.querySelector('.notification-message');

            // Ustawienie ikony w zależności od typu
            switch (type) {
                case 'success':
                    icon.className = 'fas fa-check-circle';
                    notification.style.borderLeftColor = 'var(--accent)';
                    icon.style.color = 'var(--accent)';
                    break;
                case 'error':
                    icon.className = 'fas fa-exclamation-circle';
                    notification.style.borderLeftColor = 'var(--primary-dark)';
                    icon.style.color = 'var(--primary-dark)';
                    break;
                default:
                    icon.className = 'fas fa-info-circle';
                    notification.style.borderLeftColor = 'var(--primary)';
                    icon.style.color = 'var(--primary)';
            }

            // Ustawienie wiadomości
            messageEl.textContent = message;

            // Pokazanie powiadomienia
            notification.classList.add('show');

            // Ukrycie po określonym czasie
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }

        /**
         * Pokazuje przypomnienie o ostatnio oglądanym przepisie
         */
        showRecipeReminder(recipe, onRecipeClick) {
            if (!this.isInitialized || !recipe) {
                return;
            }

            const reminderElement = document.createElement('div');
            reminderElement.className = 'recipe-reminder';
            reminderElement.innerHTML = `
                <div class="recipe-reminder-content">
                    <div class="recipe-reminder-icon">
                        <i class="fas fa-history"></i>
                    </div>
                    <div class="recipe-reminder-message">
                        Ostatnio oglądany przepis: "${this.escapeHtml(recipe.title)}". Wrócić do niego?
                    </div>
                    <div class="recipe-reminder-actions">
                        <button class="btn-return">Tak</button>
                        <button class="btn-dismiss">Nie</button>
                    </div>
                </div>
            `;

            // Dodanie elementu do body
            document.body.appendChild(reminderElement);

            // Obsługa przycisków
            const returnBtn = reminderElement.querySelector('.btn-return');
            const dismissBtn = reminderElement.querySelector('.btn-dismiss');

            returnBtn.addEventListener('click', () => {
                onRecipeClick(recipe.id);
                document.body.removeChild(reminderElement);
            });

            dismissBtn.addEventListener('click', () => {
                document.body.removeChild(reminderElement);
            });

            // Automatyczne usunięcie po 10 sekundach
            setTimeout(() => {
                if (document.body.contains(reminderElement)) {
                    document.body.removeChild(reminderElement);
                }
            }, 10000);
        }

        /**
         * Renderuje ekran powitalny
         */
        renderWelcomeScreen() {
            if (!this.isInitialized) {
                console.warn("Próba renderowania ekranu powitalnego bez zainicjalizowanych elementów");
                return;
            }

            this.elements.mainContainer.innerHTML = `
                    <div class="welcome-screen">
                        <i class="fas fa-utensils welcome-icon"></i>
                        <h1 class="welcome-title">Witaj w Książce Kucharskiej</h1>
                        <p class="welcome-desc">
                            Odkryj kolekcję starannie dobranych przepisów kulinarnych.
                            Wybierz kategorię z menu lub wyszukaj konkretny przepis.
                        </p>

                        <div class="category-grid" id="featuredCategories">
                            <!-- Tutaj zostaną wyświetlone karty kategorii -->
                        </div>
                    </div>
                `;

            // Odznaczenie aktywnej kategorii
            this.clearActiveCategory();
            this.fadeInMain();
        }

        /**
         * Renderuje listę kategorii w panelu bocznym
         */
        renderCategoryList(categories, onCategoryClick) {
            if (!this.isInitialized) {
                console.warn("Próba renderowania listy kategorii bez zainicjalizowanych elementów");
                return;
            }

            this.elements.categoryList.innerHTML = '';

            categories.forEach(category => {
                const safeName = this.escapeHtml(category.name);
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `
                        <a href="#" class="nav-link" data-category="${safeName}">
                            <span class="nav-link-inner">
                                <span class="nav-icon">
                                    <i class="fas ${this.getCategoryIcon(category.name)}"></i>
                                </span>
                                <span>${safeName}</span>
                            </span>
                            <span class="badge">${category.count}</span>
                        </a>
                    `;

                li.querySelector('a').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.clearActiveCategory();
                    li.querySelector('a').classList.add('active');
                    onCategoryClick(category.name);

                    // Zamknij panel boczny na mobilnych
                    if (window.innerWidth <= 1024) {
                        this.elements.sidebar.classList.remove('open');
                        document.body.style.overflow = 'auto';
                    }
                });

                this.elements.categoryList.appendChild(li);
            });

            // Renderowanie głównych kategorii na ekranie powitalnym
            this.renderFeaturedCategories(categories, onCategoryClick);
        }

        /**
         * Renderuje karty kategorii na ekranie powitalnym
         */
        renderFeaturedCategories(categories, onCategoryClick) {
            if (!this.isInitialized) {
                console.warn("Próba renderowania kategorii głównych bez zainicjalizowanych elementów");
                return;
            }

            const featuredContainer = document.getElementById('featuredCategories');
            if (!featuredContainer) {
                console.warn("Element featuredCategories nie został znaleziony");
                return;
            }

            featuredContainer.innerHTML = '';

            categories.forEach(category => {
                const safeName = this.escapeHtml(category.name);
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                        <div class="recipe-card-image">
                            <i class="fas ${this.getCategoryIcon(category.name)}"></i>
                            <div class="recipe-card-overlay"></div>
                        </div>
                        <div class="recipe-card-content">
                            <h3 class="recipe-card-title">${safeName}</h3>
                            <div class="recipe-meta">
                                <div class="recipe-meta-item">
                                    <i class="fas fa-book"></i>
                                    <span>${category.count} ${this.getProperForm(category.count, 'przepis', 'przepisy', 'przepisów')}</span>
                                </div>
                            </div>
                        </div>
                    `;

                card.addEventListener('click', () => {
                    onCategoryClick(category.name);

                    // Ustawienie aktywnej kategorii w panelu bocznym
                    this.clearActiveCategory();

        /**
         * Tryb gotowania — pełnoekranowy widok krok-po-kroku
         */
        async renderCookingMode(recipe, onExit) {
            if (!this.isInitialized || !recipe.instructions || recipe.instructions.length === 0) return;

            // Wake Lock — żeby ekran nie gasł w kuchni
            let wakeLock = null;
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.warn('Wake Lock niedostępny:', err);
                }
            }

            let currentStep = 0;
            const total = recipe.instructions.length;

            const overlay = document.createElement('div');
            overlay.className = 'cooking-mode';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-label', 'Tryb gotowania');
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';

            const render = () => {
                const progressPct = ((currentStep + 1) / total) * 100;
                overlay.innerHTML = `
                    <div class="cooking-mode-header">
                        <h2 class="cooking-mode-title">${this.escapeHtml(recipe.title)}</h2>
                        <button class="cooking-mode-close" id="cookingClose" aria-label="Wyjdź z trybu gotowania">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="cooking-mode-body">
                        <div class="cooking-step-counter">Krok ${currentStep + 1} z ${total}</div>
                        <div class="cooking-step-text">${this.escapeHtml(recipe.instructions[currentStep])}</div>
                    </div>
                    <div class="cooking-mode-footer">
                        <button class="btn btn-secondary btn-large" id="cookingPrev" ${currentStep === 0 ? 'disabled' : ''} aria-label="Poprzedni krok">
                            <i class="fas fa-chevron-left"></i> Wstecz
                        </button>
                        <div class="cooking-progress" aria-label="Postęp">
                            <div class="cooking-progress-bar" style="width: ${progressPct}%"></div>
                        </div>
                        <button class="btn btn-primary btn-large" id="cookingNext" ${currentStep === total - 1 ? 'disabled' : ''} aria-label="Następny krok">
                            Dalej <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                `;

                document.getElementById('cookingClose').addEventListener('click', exit);
                document.getElementById('cookingPrev').addEventListener('click', () => {
                    if (currentStep > 0) { currentStep--; render(); }
                });
                document.getElementById('cookingNext').addEventListener('click', () => {
                    if (currentStep < total - 1) { currentStep++; render(); }
                });
            };

            const keyHandler = (e) => {
                if (e.key === 'Escape') exit();
                else if (e.key === 'ArrowRight' || e.key === ' ') {
                    if (currentStep < total - 1) { currentStep++; render(); }
                    e.preventDefault();
                }
                else if (e.key === 'ArrowLeft') {
                    if (currentStep > 0) { currentStep--; render(); }
                    e.preventDefault();
                }
            };

            const exit = (fromHistoryPop = false) => {
                overlay._exitFn = null;
                document.removeEventListener('keydown', keyHandler);
                if (wakeLock) wakeLock.release().catch(() => {});
                if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                document.body.style.overflow = 'auto';
                // Jeśli wyjście było ręczne (X / Esc), cofnij wpis historii dodany przy wejściu
                if (!fromHistoryPop) history.back();
                if (onExit) onExit();
            };

            overlay._exitFn = () => exit(true);
            document.addEventListener('keydown', keyHandler);
            render();
        }

        /**
         * Sortuje listę przepisów wg klucza
         */
        sortRecipes(recipes, sortKey) {
            const copy = [...recipes];
            switch (sortKey) {
                case 'alpha':
                    return copy.sort((a, b) => a.title.localeCompare(b.title, 'pl'));
                case 'time-asc':
                    return copy.sort((a, b) => (a.prepTime || 0) - (b.prepTime || 0));
                case 'time-desc':
                    return copy.sort((a, b) => (b.prepTime || 0) - (a.prepTime || 0));
                case 'ingredients-asc':
                    return copy.sort((a, b) => (a.ingredients?.length || 0) - (b.ingredients?.length || 0));
                default:
                    return copy;
            }
        }

                const nowFav = callbacks.onToggleFavorite(recipe.id);
                favBtn.classList.toggle('active', nowFav);
                favBtn.setAttribute('aria-pressed', String(nowFav));
                favBtn.setAttribute('aria-label', nowFav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych');
                favBtn.querySelector('i').className = (nowFav ? 'fas' : 'far') + ' fa-star';
            });

            // Tryb gotowania
            const cookingBtn = document.getElementById('cookingModeBtn');
            if (cookingBtn) {
                cookingBtn.addEventListener('click', () => callbacks.onStartCooking(recipe.id));
            }

            // Lista zakupów — dodajemy NIEZAZNACZONE (= brakujące, których nie odhaczyliśmy jako "mam")
            document.getElementById('addShoppingBtn').addEventListener('click', () => {
                const missing = [...document.querySelectorAll('#ingredientsContainer .ingredient-check:not(:checked)')].map(cb => ({
                    amount: cb.dataset.amount,
                    name: cb.dataset.name
                }));
                if (missing.length === 0) {
                    this.showNotification('Wszystkie składniki są oznaczone jako "mam"', 'info');
                    return;
                }
                callbacks.onAddToShoppingList(recipe.id, missing);
            });

            // Drukuj
            document.getElementById('printBtn').addEventListener('click', () => window.print());

            // Powrót
            document.getElementById('backButton').addEventListener('click', callbacks.onBack);

            this.fadeInMain();
        }

        /**
         * Renderuje listę składników (z aktualnym skalowaniem porcji)
         */
        renderIngredients(recipe, currentServings) {
            const container = document.getElementById('ingredientsContainer');
            if (!container) return;

            const factor = recipe.servings > 0 ? currentServings / recipe.servings : 1;

            if (!recipe.ingredients || recipe.ingredients.length === 0) {
                container.innerHTML = '<p>Brak składników</p>';
                return;
            }

            container.innerHTML = recipe.ingredients.map(ing => {
                const scaledAmount = this.scaleAmount(ing.amount, factor);
                return `
                    <div class="ingredient-item">
                        <label title="Zaznacz jeśli masz już ten składnik">
                            <input type="checkbox" class="ingredient-check"
                                   data-amount="${this.escapeHtml(scaledAmount)}"
                                   data-name="${this.escapeHtml(ing.name)}">
                            <span class="ingredient-text">
                                ${scaledAmount ? `<span class="ingredient-amount">${this.escapeHtml(scaledAmount)}</span> ` : ''}
                                ${this.escapeHtml(ing.name)}
                            </span>
                        </label>
                    </div>
                `;
            }).join('');

            // Zaznaczenie = "mam to już" → przekreślenie
            container.querySelectorAll('.ingredient-check').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    e.target.closest('.ingredient-item').classList.toggle('checked', e.target.checked);
                });
            });
        }

        /**
         * Renderuje wyniki wyszukiwania
         */
        renderSearchResults(results, onRecipeClick) {
            if (!this.isInitialized) {
                console.warn("Próba renderowania wyników wyszukiwania bez zainicjalizowanych elementów");
                return;
            }

            if (!results) {
                return;
            }

            const {query, exact, partial, totalCount, shortWords} = results;

            const safeQuery = this.escapeHtml(query);
            const safeShortWords = shortWords ? shortWords.map(w => this.escapeHtml(w)).join(', ') : '';
            this.elements.mainContainer.innerHTML = `
                    <div class="back-btn" id="backToHome">
                        <i class="fas fa-arrow-left"></i> Powrót
                    </div>

                    <div class="search-results">
                        <div class="page-header">
                            <h1 class="page-title">
                                <i class="fas fa-search"></i>
                                Wyniki wyszukiwania
                            </h1>
                            <p class="page-subtitle">
                                ${totalCount > 0
                ? `Znaleziono ${totalCount} ${this.getProperForm(totalCount, 'przepis', 'przepisy', 'przepisów')} dla "${safeQuery}"`
                : `Nie znaleziono przepisów dla "${safeQuery}"`
            }
                            </p>
                            ${shortWords && shortWords.length > 0
                ? `<div class="search-info">
                                    <i class="fas fa-info-circle"></i>
                                    Uwaga: Krótkie słowa (${safeShortWords}) są uwzględniane w wyszukiwaniu.
                                  </div>`
                : ''
            }
                        </div>

                        ${totalCount === 0 ? `
                            <div class="no-results">
                                <i class="fas fa-search no-results-icon"></i>
                                <p class="no-results-text">Nie znaleziono przepisów</p>
                                <p>Spróbuj innych słów kluczowych lub przeglądaj przepisy według kategorii.</p>
                            </div>
                        ` : ''}

                        ${exact.length > 0 ? `
                            <div class="results-group">
                                <h2 class="results-group-title">Najlepsze dopasowania</h2>
                                ${exact.map(match => this.createSearchResultItem(match, query)).join('')}
                            </div>
                        ` : ''}

                        ${partial.length > 0 ? `
                            <div class="results-group">
                                <h2 class="results-group-title">Podobne przepisy</h2>
                                ${partial.map(match => this.createSearchResultItem(match, query)).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;

            // Obsługa przycisku powrotu
            document.getElementById('backToHome').addEventListener('click', () => {
                this.renderWelcomeScreen();
            });

            // Obsługa kliknięcia na przepis
            document.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const recipeId = parseInt(item.dataset.id);
                    onRecipeClick(recipeId);
                });
            });

            this.fadeInMain();
        }

        /**
         * Tworzy element wyniku wyszukiwania
         */
        createSearchResultItem(match, query) {
            const {recipe, matchInfo} = match;

            let matchText = '';
            let matchReasonText = '';
            if (matchInfo.matchedWords.length > 0) {
                matchReasonText = `<div class="match-reason">
                        <i class="fas fa-search"></i> Dopasowane słowa: ${matchInfo.matchedWords.map(word =>
                    `<span class="match-highlight">${this.escapeHtml(word)}</span>`).join(', ')}
                    </div>`;
            }

            if (matchInfo.matchedTitle) {
                const titleHtml = this.highlightText(recipe.title, matchInfo.matchedWords);
                matchText += `<div class="match-info">Tytuł: ${titleHtml}</div>`;
            }

            if (matchInfo.matchedCategory) {
                const categoryHtml = this.highlightText(recipe.category, matchInfo.matchedWords);
                matchText += `<div class="match-info">Kategoria: ${categoryHtml}</div>`;
            }

            if (matchInfo.matchedIngredients.length > 0) {
                const ingredientsHtml = matchInfo.matchedIngredients
                    .slice(0, 2)
                    .map(m => `<span class="match-highlight">${this.escapeHtml(m.searchWord)}</span> (${this.escapeHtml(m.ingredient)})`)
                    .join(', ');

                matchText += `<div class="match-info">Składniki: ${ingredientsHtml}${matchInfo.matchedIngredients.length > 2 ? ' i inne...' : ''}</div>`;
            }

            if (matchInfo.matchedInstructions.length > 0) {
                const instructionsHtml = matchInfo.matchedInstructions
                    .slice(0, 1)
                    .map(m => `<span class="match-highlight">${this.escapeHtml(m.searchWord)}</span> (krok ${m.instructionIndex + 1})`)
                    .join(', ');

                matchText += `<div class="match-info">Instrukcje: ${instructionsHtml}${matchInfo.matchedInstructions.length > 1 ? ' i inne...' : ''}</div>`;
            }

            return `
                    <div class="search-result-item" data-id="${this.escapeHtml(recipe.id)}">
                        <h3 class="search-result-title">${this.escapeHtml(recipe.title)}</h3>
                        <div class="search-result-category">
                            <i class="fas fa-tag"></i> ${this.escapeHtml(recipe.category || 'Bez kategorii')}
                        </div>
                        ${matchReasonText}
                        <div class="recipe-meta" style="margin-top: 10px;">
                            <div class="recipe-meta-item">
                                <i class="fas fa-clock"></i>
                                <span>${recipe.prepTime} min</span>
                            </div>
                            <div class="recipe-meta-item">
                                <i class="fas fa-user"></i>
                                <span>${recipe.servings} ${this.getProperForm(recipe.servings, 'porcja', 'porcje', 'porcji')}</span>
                            </div>
                        </div>
                        ${matchText}
                    </div>
                `;
        }

        /**
         * Odznacza aktywną kategorię w menu
         */
        clearActiveCategory() {
            if (!this.isInitialized) {
                console.warn("Próba odznaczenia aktywnej kategorii bez zainicjalizowanych elementów");
                return;
            }

            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
        }

        /**
         * Konfiguruje wyszukiwarkę
         */
        setupSearch(onSearch) {
            if (!this.isInitialized) {
                console.warn("Próba konfiguracji wyszukiwarki bez zainicjalizowanych elementów");
                return;
            }

            if (!this.elements.searchInput) {
                console.error("Element searchInput nie został znaleziony podczas konfiguracji wyszukiwarki");
                return;
            }

            console.log("Konfiguracja wyszukiwarki...");

            let timeoutId = null;

            this.elements.searchInput.addEventListener('input', () => {
                const query = this.elements.searchInput.value.trim();

                // Czyszczenie poprzedniego timera
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }

                // Ustawienie opóźnienia dla live search
                timeoutId = setTimeout(() => {
                    onSearch(query);
                }, 300);
            });

            // Wysyłanie formularza na enter
            this.elements.searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = this.elements.searchInput.value.trim();
                    if (query.length >= 2) {
                        if (timeoutId) {
                            clearTimeout(timeoutId);
                        }
                        onSearch(query);
                    }
                }
            });

            console.log("Konfiguracja wyszukiwarki zakończona");
        }

        /**
         * Konfiguruje akcję dla logo (powrót do ekranu powitalnego)
         */
        setupHomeAction(onHomeClick) {
            if (!this.isInitialized) {
                console.warn("Próba konfiguracji akcji logo bez zainicjalizowanych elementów");
                return;
            }

            if (!this.elements.logo) {
                console.error("Element logo nie został znaleziony podczas konfiguracji akcji logo");
                return;
            }

            console.log("Konfiguracja akcji logo...");

            this.elements.logo.addEventListener('click', (e) => {
                e.preventDefault();
                onHomeClick();

                // Zamknij panel boczny na mobilnych
                if (window.innerWidth <= 1024) {
                    this.elements.sidebar.classList.remove('open');
                    document.body.style.overflow = 'auto';
                }
            });

            console.log("Konfiguracja akcji logo zakończona");
        }

        /**
         * Konfiguruje przycisk zmiany motywu
         */
        setupThemeToggle(onThemeToggle) {
            if (!this.isInitialized) {
                console.warn("Próba konfiguracji przycisku motywu bez zainicjalizowanych elementów");
                return;
            }

            if (!this.elements.themeToggle) {
                console.error("Element themeToggle nie został znaleziony podczas konfiguracji przycisku motywu");
                return;
            }

            console.log("Konfiguracja przycisku motywu...");

            this.elements.themeToggle.addEventListener('click', () => {
                onThemeToggle();
            });

            console.log("Konfiguracja przycisku motywu zakończona");
        }

        /**
         * Aplikuje motyw (jasny/ciemny)
         */
        applyTheme(darkMode) {
            if (!this.isInitialized) {
                console.warn("Próba aplikacji motywu bez zainicjalizowanych elementów");
                return;
            }

            if (!this.elements.themeToggle) {
                console.error("Element themeToggle nie został znaleziony podczas aplikacji motywu");
                return;
            }

            const themeIcon = this.elements.themeToggle.querySelector('i');
            if (!themeIcon) {
                console.error("Ikona motywu nie została znaleziona podczas aplikacji motywu");
                return;
            }

            if (darkMode) {
                document.body.classList.add('dark-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        /**
         * Parsuje pojedynczy fragment liczbowy: "3", "0.5", "1/2", "1 1/2", "0,5"
         */
        parseSingleNumber(str) {
            str = str.trim();
            const mixed = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
            if (mixed) return parseFloat(mixed[1]) + parseFloat(mixed[2]) / parseFloat(mixed[3]);
            const frac = str.match(/^(\d+)\/(\d+)$/);
            if (frac) return parseFloat(frac[1]) / parseFloat(frac[2]);
            const dec = str.match(/^(\d+(?:[.,]\d+)?)$/);
            if (dec) return parseFloat(dec[1].replace(',', '.'));
            return null;
        }

        /**
         * Parsuje ilość: zwraca { kind: 'number'|'range'|'unknown', value, value2?, suffix }
         */
        parseAmount(amountStr) {
            if (!amountStr || !amountStr.trim()) return { kind: 'unknown', suffix: amountStr || '' };

            let s = amountStr.trim().replace(/^pół\b/i, '1/2');
            const numToken = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?)';

            const rangeRegex = new RegExp(`^(${numToken})\\s*[-–—]\\s*(${numToken})(.*)$`);
            const rangeMatch = s.match(rangeRegex);
            if (rangeMatch) {
                const v1 = this.parseSingleNumber(rangeMatch[1]);
                const v2 = this.parseSingleNumber(rangeMatch[2]);
                if (v1 !== null && v2 !== null) {
                    return { kind: 'range', value: v1, value2: v2, suffix: rangeMatch[3] };
                }
            }

            const singleRegex = new RegExp(`^(${numToken})(.*)$`);
            const singleMatch = s.match(singleRegex);
            if (singleMatch) {
                const v = this.parseSingleNumber(singleMatch[1]);
                if (v !== null) return { kind: 'number', value: v, suffix: singleMatch[2] };
            }

            return { kind: 'unknown', suffix: amountStr };
        }

        /**
         * Formatuje liczbę jako ułamek typowy dla kuchni lub dziesiętnie (z polskim przecinkiem)
         */
        formatScaledNumber(value) {
            if (!isFinite(value) || value <= 0) return '';
            const tolerance = 0.03;
            const fractions = [
                { value: 1/8, str: '1/8' },
                { value: 1/4, str: '1/4' },
                { value: 1/3, str: '1/3' },
                { value: 1/2, str: '1/2' },
                { value: 2/3, str: '2/3' },
                { value: 3/4, str: '3/4' }
            ];

            const intPart = Math.floor(value);
            const fracPart = value - intPart;

            if (fracPart < tolerance) return String(intPart);
            if (1 - fracPart < tolerance) return String(intPart + 1);

            for (const f of fractions) {
                if (Math.abs(fracPart - f.value) < tolerance) {
                    return intPart > 0 ? `${intPart} ${f.str}` : f.str;
                }
            }

            if (value >= 10) return String(Math.round(value));
            return value.toFixed(1).replace('.', ',');
        }

        /**
         * Skaluje string z ilością (np. "3 szklanki") przez factor
         */
        scaleAmount(amountStr, factor) {
            if (factor === 1 || !amountStr) return amountStr;
            const parsed = this.parseAmount(amountStr);

            if (parsed.kind === 'number') {
                return this.formatScaledNumber(parsed.value * factor) + parsed.suffix;
            }
            if (parsed.kind === 'range') {
                return this.formatScaledNumber(parsed.value * factor) + '-' +
                    this.formatScaledNumber(parsed.value2 * factor) + parsed.suffix;
            }
            return amountStr;
        }

        /**
         * Retriggers fade-in animation on mainContainer
         */
        fadeInMain() {
            const m = this.elements.mainContainer;
            if (!m) return;
            m.classList.remove('fade-in');
            // Force reflow tak żeby animacja zaczęła się od nowa
            void m.offsetWidth;
            m.classList.add('fade-in');
        }

        /**
         * Escape'uje tekst do bezpiecznego wstrzyknięcia w innerHTML
         */
        escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Podświetla tekst zgodnie z wyszukiwanymi słowami (z bezpiecznym escape)
         */
        highlightText(text, searchWords) {
            if (!text) return '';
            let result = this.escapeHtml(text);

            // Sortuj słowa wg długości (dłuższe najpierw) aby uniknąć problemów z podwójnym podświetleniem
            const sortedWords = [...searchWords].sort((a, b) => b.length - a.length);

            for (const word of sortedWords) {
                const escapedWord = this.escapeHtml(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (!escapedWord) continue;
                const regex = new RegExp(`(${escapedWord})`, 'gi');
                result = result.replace(regex, '<span class="match-highlight">$1</span>');
            }

            return result;
        }

        /**
         * Zwraca odpowiednią formę słowa w zależności od liczby (polski)
         */
        getProperForm(count, form1, form2, form5) {
            if (count === 1) {
                return form1;
            } else if (count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 10 || count % 100 >= 20)) {
                return form2;
            } else {
                return form5;
            }
        }

        /**
         * Zwraca ikonę dla przepisu na podstawie tytułu i kategorii
         */
        getRecipeIcon(title, category) {
            const lowerTitle = title ? title.toLowerCase() : '';
            const lowerCategory = category ? category.toLowerCase() : '';

            if (lowerCategory.includes('zupa') || lowerTitle.includes('zupa')) return 'fa-bowl-food';
            if (lowerCategory.includes('deser') || lowerTitle.includes('deser')) return 'fa-ice-cream';
            if (lowerCategory.includes('ciasto') || lowerTitle.includes('ciasto')) return 'fa-cake-candles';
            if (lowerTitle.includes('sałat')) return 'fa-leaf';
            if (lowerTitle.includes('napój') || lowerTitle.includes('sok')) return 'fa-glass-water';
            if (lowerTitle.includes('mięso') || lowerTitle.includes('burger')) return 'fa-drumstick-bite';
            if (lowerTitle.includes('pizza')) return 'fa-pizza-slice';

            return 'fa-utensils';
        }

        /**
         * Zwraca ikonę dla kategorii
         */
        getCategoryIcon(category) {
            const lowerCategory = category ? category.toLowerCase() : '';

            if (lowerCategory.includes('zupa')) return 'fa-bowl-food';
            if (lowerCategory.includes('deser')) return 'fa-ice-cream';
            if (lowerCategory.includes('ciast')) return 'fa-cake-candles';
            if (lowerCategory.includes('sałat') || lowerCategory.includes('przystaw')) return 'fa-leaf';
            if (lowerCategory.includes('napoj') || lowerCategory.includes('napój')) return 'fa-glass-water';
            if (lowerCategory.includes('mięs')) return 'fa-drumstick-bite';
            if (lowerCategory.includes('dania główne') || lowerCategory.includes('danie główne')) return 'fa-plate-wheat';
            if (lowerCategory.includes('pieczyw')) return 'fa-bread-slice';
            if (lowerCategory.includes('przetwor')) return 'fa-jar';

            return 'fa-utensils';
        }
    }

    /**
     * Klasa kontrolera zarządzająca aplikacją
     */
    class RecipeController {
        constructor(model, view) {
            this.model = model;
            this.view = view;

            // Stan aplikacji
            this.isInitialized = false;
        }

        /**
         * Konfiguruje nasłuchiwacze zdarzeń w widoku
         */
        setupEventListeners() {
            this.view.setupSearch(this.handleSearch.bind(this));
            this.view.setupHomeAction(this.handleHomeClick.bind(this));
            this.view.setupThemeToggle(this.handleThemeToggle.bind(this));
            this.view.initMobileMenu();

            // Linki "Skróty" w sidebarze
            if (this.view.elements.favoritesLink) {
                this.view.elements.favoritesLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.handleShowFavorites();
                    if (window.innerWidth <= 1024) {
                        this.view.elements.sidebar.classList.remove('open');
                        document.body.style.overflow = 'auto';
                    }
                });
            }
            if (this.view.elements.shoppingListLink) {
                this.view.elements.shoppingListLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.handleShowShoppingList();
                    if (window.innerWidth <= 1024) {
                        this.view.elements.sidebar.classList.remove('open');
                        document.body.style.overflow = 'auto';
                    }
                });
            }

            // Skróty klawiszowe
            document.addEventListener('keydown', (e) => {
                // Ignoruj jeśli użytkownik pisze w polu tekstowym
                const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);

                if (e.key === '/' && !inField) {
                    e.preventDefault();
                    this.view.elements.searchInput?.focus();
                } else if (e.key === 'Escape') {
                    if (this.view.elements.sidebar.classList.contains('open')) {
                        this.view.elements.sidebar.classList.remove('open');
                        document.body.style.overflow = 'auto';
                    } else if (inField && document.activeElement === this.view.elements.searchInput) {
                        this.view.elements.searchInput.blur();
                    }
                }
            });
        }

        /**
         * Inicjalizacja aplikacji
         */
        async init() {
            try {
                console.log("Inicjalizacja aplikacji...");

                // Inicjalizacja widoku
                const viewInitialized = this.view.initialize();
                if (!viewInitialized) {
                    console.error("Nie udało się zainicjalizować widoku");
                    throw new Error("Nie udało się zainicjalizować widoku");
                }

                // Pokazanie loadera
                this.view.setLoading(true);

                // Ustawienie motywu
                this.view.applyTheme(this.model.darkMode);

                // Konfiguracja nasłuchiwaczy zdarzeń
                this.setupEventListeners();

                await this.model.loadRecipes();

                this.view.renderWelcomeScreen();
                this.view.renderCategoryList(this.model.categories, this.handleCategoryClick.bind(this));
                this.view.renderRecentRecipes(this.model.recentRecipes, this.handleRecipeClick.bind(this));
                this.view.renderFavoritesSidebar(this.model.getFavoriteRecipes(), this.handleRecipeClick.bind(this));
                this.view.setBadges(this.model.favorites.length, this.model.shoppingList.length);

                const lastViewedRecipe = this.model.checkForLastViewedRecipe();
                if (lastViewedRecipe) {
                    this.view.showRecipeReminder(lastViewedRecipe, this.handleRecipeClick.bind(this));
                }

                this.view.setLoading(false);
                this.isInitialized = true;

                // Routing — back/forward przeglądarki + deep links
                window.addEventListener('popstate', () => this.handleHashChange());
                this.handleHashChange();
            } catch (error) {
                console.error('Błąd podczas inicjalizacji aplikacji:', error);

                // Ukrycie loadera
                if (this.view.isInitialized) {
                    this.view.setLoading(false);
                }

                // Pokazanie komunikatu o błędzie
                if (this.view.isInitialized) {
                    this.view.showNotification('Nie udało się wczytać przepisów. Spróbuj odświeżyć stronę.', 'error', 5000);
                }

                // Wyświetlenie prostego ekranu błędu
                const mainContainer = document.getElementById('mainContainer');
                if (mainContainer) {
                    mainContainer.innerHTML = `
                            <div class="welcome-screen">
                                <i class="fas fa-exclamation-triangle" style="color: var(--primary); font-size: 4rem; margin-bottom: 2rem;"></i>
                                <h1 class="welcome-title">Wystąpił błąd</h1>
                                <p class="welcome-desc">
                                    Nie udało się wczytać przepisów. Sprawdź połączenie internetowe i spróbuj odświeżyć stronę.
                                </p>
                                <button class="btn btn-primary" onclick="location.reload()">
                                    <i class="fas fa-sync-alt"></i> Odśwież stronę
                                </button>
                            </div>
                        `;
                }

                if (document.getElementById('loader')) {
                    document.getElementById('loader').style.display = 'none';
                }
            }
        }

        /**
         * Obsługa kliknięcia na kategorię
         */
        navigate(hash) {
            if (window.location.hash === hash) return;
            history.pushState(null, '', hash);
        }

        handleCategoryClick(category) {
            if (!this.isInitialized) return;

            this.navigate('#/category/' + encodeURIComponent(category));
            this.model.clearLastViewedRecipe();
            const recipes = this.model.getRecipesByCategory(category);

            this.view.renderCategoryPage(category, recipes, {
                onRecipeClick: this.handleRecipeClick.bind(this),
                isFavorite: (rid) => this.model.isFavorite(rid),
                onToggleFavorite: (rid) => {
                    const nowFav = this.model.toggleFavorite(rid);
                    this.view.renderFavoritesSidebar(this.model.getFavoriteRecipes(), this.handleRecipeClick.bind(this));
                    this.view.setBadges(this.model.favorites.length, this.model.shoppingList.length);
                    return nowFav;
                }
            });
        }

        /**
         * Obsługa kliknięcia na przepis
         */
        handleRecipeClick(id) {
            if (!this.isInitialized) return;

            const recipe = this.model.getRecipeById(id);
            if (!recipe) {
                this.view.showNotification('Przepis nie został znaleziony', 'error');
                return;
            }

            this.navigate('#/recipe/' + id);
            this.model.addToRecentRecipes(recipe);
            this.view.renderRecentRecipes(this.model.recentRecipes, this.handleRecipeClick.bind(this));

            this.model.currentRecipe = recipe;
            this.model.saveCurrentRecipeForReload(recipe);

            this.view.renderRecipeDetail(recipe, {
                onBack: () => {
                    if (this.model.searchResults) {
                        this.view.renderSearchResults(this.model.searchResults, this.handleRecipeClick.bind(this));
                    } else if (this.model.currentCategory) {
                        this.handleCategoryClick(this.model.currentCategory);
                    } else {
                        this.view.renderWelcomeScreen();
                    }
                },
                isFavorite: (rid) => this.model.isFavorite(rid),
                onToggleFavorite: (rid) => {
                    const nowFav = this.model.toggleFavorite(rid);
                    this.view.renderFavoritesSidebar(this.model.getFavoriteRecipes(), this.handleRecipeClick.bind(this));
                    this.view.setBadges(this.model.favorites.length, this.model.shoppingList.length);
                    this.view.showNotification(
                        nowFav ? 'Dodano do ulubionych' : 'Usunięto z ulubionych',
                        'success', 1500
                    );
                    return nowFav;
                },
                onAddToShoppingList: (rid, items) => {
                    this.model.addToShoppingList(rid, items);
                    this.view.setBadges(this.model.favorites.length, this.model.shoppingList.length);
                    this.view.showNotification(
                        `Dodano ${items.length} ${this.view.getProperForm(items.length, 'składnik', 'składniki', 'składników')} do listy zakupów`,
                        'success'
                    );
                },
                onStartCooking: (rid) => this.handleStartCooking(rid)
            });
        }

        handleStartCooking(recipeId) {
            const recipe = this.model.getRecipeById(recipeId);
            if (!recipe || !recipe.instructions || recipe.instructions.length === 0) {
                this.view.showNotification('Brak instrukcji do trybu gotowania', 'error');
                return;
            }
            // Duplikat wpisu w historii — back zamknie overlay zamiast cofać o widok wstecz
            history.pushState(null, '', window.location.hash || '#/recipe/' + recipeId);
            this.view.renderCookingMode(recipe, null);
        }

        handleShowFavorites() {
            this.navigate('#/favorites');
            this.model.currentCategory = null;
            this.model.searchResults = null;
            this.model.clearLastViewedRecipe();
            this.view.renderFavoritesView(
                this.model.getFavoriteRecipes(),
                this.handleRecipeClick.bind(this),
                (rid) => {
                    this.model.toggleFavorite(rid);
                    this.handleShowFavorites();
                    this.view.renderFavoritesSidebar(this.model.getFavoriteRecipes(), this.handleRecipeClick.bind(this));
                }
            );
        }

        handleShowShoppingList() {
            this.navigate('#/shopping');
            this.model.currentCategory = null;
            this.model.searchResults = null;
            this.model.clearLastViewedRecipe();
            const refresh = () => {
                this.view.setBadges(this.model.favorites.length, this.model.shoppingList.length);
                this.handleShowShoppingList();
            };
            this.view.renderShoppingListView(this.model.shoppingList, {
                onToggle: (itemId) => {
                    this.model.toggleShoppingItem(itemId);
                    refresh();
                },
                onRemove: (itemId) => {
                    this.model.removeShoppingItem(itemId);
                    refresh();
                },
                onClearChecked: () => {
                    this.model.clearCheckedShopping();
                    refresh();
                },
                onClearAll: () => {
                    if (confirm('Wyczyścić całą listę zakupów?')) {
                        this.model.clearShoppingList();
                        refresh();
                    }
                },
                onCopy: () => {
                    const text = this.model.shoppingList
                        .map(i => `- ${i.amount ? i.amount + ' ' : ''}${i.name}`)
                        .join('\n');
                    navigator.clipboard.writeText(text)
                        .then(() => this.view.showNotification('Lista skopiowana do schowka', 'success'))
                        .catch(() => this.view.showNotification('Nie udało się skopiować listy', 'error'));
                }
            });
        }

        /**
         * Routing po hash URL — odpala odpowiedni widok na podstawie #/...
         */
        handleHashChange() {
            if (!this.isInitialized) return;

            // Zamknij overlay trybu gotowania (jeśli aktywny) przy zmianie URL
            const cookOverlay = document.querySelector('.cooking-mode');
            if (cookOverlay) {
                if (typeof cookOverlay._exitFn === 'function') cookOverlay._exitFn();
                else {
                    cookOverlay.remove();
                    document.body.style.overflow = 'auto';
                }
            }

            const hash = window.location.hash;

            if (!hash || hash === '#' || hash === '#/') {
                this.view.renderWelcomeScreen();
                this.view.renderFeaturedCategories(this.model.categories, this.handleCategoryClick.bind(this));
                this.model.currentCategory = null;
                this.model.searchResults = null;
                return;
            }

            const recipeMatch = hash.match(/^#\/recipe\/(\d+)$/);
            if (recipeMatch) return this.handleRecipeClick(parseInt(recipeMatch[1], 10));

            const categoryMatch = hash.match(/^#\/category\/(.+)$/);
            if (categoryMatch) return this.handleCategoryClick(decodeURIComponent(categoryMatch[1]));

            if (hash === '#/shopping') return this.handleShowShoppingList();
            if (hash === '#/favorites') return this.handleShowFavorites();

            const searchMatch = hash.match(/^#\/search\/(.+)$/);
            if (searchMatch) {
                const q = decodeURIComponent(searchMatch[1]);
                this.view.elements.searchInput.value = q;
                return this.handleSearch(q);
            }
        }

        /**
         * Obsługa wyszukiwania
         */
        handleSearch(query) {
            if (!this.isInitialized) return;
            if (!query || query.length < 2) return;

            this.model.clearLastViewedRecipe();
            const results = this.model.searchRecipes(query);
            this.view.renderSearchResults(results, this.handleRecipeClick.bind(this));
        }

        /**
         * Obsługa kliknięcia na logo (powrót do ekranu głównego)
         */
        handleHomeClick() {
            if (!this.isInitialized) return;

            // Wyczyść hash w URL — pushState dla zachowania historii back/forward
            if (window.location.hash) {
                history.pushState(null, '', window.location.pathname);
            }

            this.model.clearLastViewedRecipe();
            this.view.renderWelcomeScreen();
            this.view.renderFeaturedCategories(this.model.categories, this.handleCategoryClick.bind(this));

            this.model.currentCategory = null;
            this.model.searchResults = null;
        }

        /**
         * Obsługa przełączania motywu
         */
        handleThemeToggle() {
            const darkMode = this.model.toggleTheme();
            this.view.applyTheme(darkMode);

            // Powiadomienie o zmianie motywu
            this.view.showNotification(
                darkMode ? 'Przełączono na tryb ciemny' : 'Przełączono na tryb jasny',
                'success'
            );
        }
    }

    let appController = null;

    function initApp() {
        if (!appController) {
            const model = new RecipeModel();
            const view = new RecipeView();
            appController = new RecipeController(model, view);
            appController.init();
        }
    }

    // Inicjalizacja aplikacji po załadowaniu dokumentu
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        // Dokument już załadowany
        initApp();
    }
</script>
</body>
</html>
