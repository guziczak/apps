<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Książka Kucharska</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============= ZMIENNE ============= */
        :root {
            /* Kolory */
            --primary: #ff6b6b;
            --primary-dark: #e74c3c;
            --primary-light: #ff8a8a;
            --primary-bg: rgba(255, 107, 107, 0.1);
            --accent: #20bf6b;
            --accent-light: #26de81;

            /* Tło i karty */
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --secondary: #f8f9fa;

            /* Dodanie wartości RGB dla kolorów tła */
            --bg-color-rgb: 255, 255, 255;
            --card-bg-rgb: 255, 255, 255;
            --secondary-rgb: 248, 249, 250;

            /* Tekst */
            --text: #2d3436;
            --text-light: #636e72;
            --text-muted: #b2bec3;

            /* Granice i elementy */
            --border: #e9ecef;
            --border-light: #f1f3f5;

            /* Cienie */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);

            /* Zaokrąglenia */
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            /* Odstępy */
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;

            /* Animacje */
            --transition-fast: all 0.2s ease;
            --transition: all 0.3s ease;
            --transition-slow: all 0.4s ease;

            /* Układy */
            --header-height: 70px;
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 80px;
        }

        /* Tryb ciemny - zmienne */
        .dark-mode {
            --primary: #ff7b7b;
            --primary-dark: #e74c3c;
            --primary-light: #ff9d9d;
            --primary-bg: rgba(255, 107, 107, 0.15);

            --bg-color: #18191a;
            --card-bg: #242526;
            --secondary: #2a2b2c;

            /* Dodanie wartości RGB dla kolorów tła w trybie ciemnym */
            --bg-color-rgb: 24, 25, 26;
            --card-bg-rgb: 36, 37, 38;
            --secondary-rgb: 42, 43, 44;

            --text: #f5f6fa;
            --text-light: #dcdde1;
            --text-muted: #9da5b4;

            --border: #3e4042;
            --border-light: #4a4b4d;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* ============= RESET I PODSTAWY ============= */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--secondary);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button, input {
            font-family: inherit;
            font-size: 1rem;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ============= UKŁAD STRONY ============= */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        .content-wrapper {
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            margin-left: var(--sidebar-width);
        }

        .main-content {
            flex-grow: 1;
            padding: var(--spacing-lg) var(--spacing-md);
            margin-top: var(--header-height);
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 var(--spacing);
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                margin-left: 0;
            }
        }

        /* ============= NAGŁÓWEK ============= */
        .header {
            height: var(--header-height);
            background-color: var(--bg-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            right: 0;
            left: var(--sidebar-width);
            z-index: 90;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(var(--bg-color-rgb), 0.95);
        }

        .header-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-md);
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.25rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: var(--transition-fast);
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-toggle:hover {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        .dark-mode .mobile-menu-toggle {
            color: var(--text);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
            margin: 0 var(--spacing-lg);
        }

        .search-box {
            width: 100%;
            height: 46px;
            padding: 0 var(--spacing-lg) 0 var(--spacing-xl);
            border: 1px solid var(--border);
            border-radius: 50px;
            background-color: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        .search-icon {
            position: absolute;
            left: var(--spacing);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .header-actions {
            display: flex;
            gap: var(--spacing);
        }

        .header-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .header-btn:hover {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        /* Poprawienie kontrastu ikon w trybie ciemnym */
        .dark-mode .mobile-menu-toggle,
        .dark-mode .header-btn {
            color: var(--text);
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark-mode .mobile-menu-toggle:hover,
        .dark-mode .header-btn:hover {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        @media (max-width: 1024px) {
            .header {
                left: 0;
            }

            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: var(--spacing);
            }

            .search-container {
                margin: 0 var(--spacing);
            }
        }

        @media (max-width: 768px) {
            .search-container {
                max-width: none;
                width: 100%;
            }

            .header-actions {
                margin-left: var(--spacing);
            }
        }

        @media (max-width: 480px) {
            .header-container {
                padding: 0 var(--spacing);
            }

            .search-box {
                height: 42px;
            }
        }

        /* ============= PANEL BOCZNY ============= */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-color);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: var(--transition);
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                box-shadow: none;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: var(--shadow-lg);
            }
        }

        .sidebar-inner {
            height: 100%;
            overflow-y: auto;
            width: var(--sidebar-width);
            padding: var(--spacing-lg) 0;
        }

        .sidebar-header {
            padding: 0 var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-weight: 600;
            color: var(--primary);
            font-size: 1.25rem;
        }

        .logo i {
            font-size: 1.5rem;
        }

        .sidebar-close {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.25rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: var(--transition-fast);
        }

        .sidebar-close:hover {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        .sidebar-section {
            margin-bottom: var(--spacing-lg);
        }

        .sidebar-title {
            padding: 0 var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .nav-list {
            margin-bottom: var(--spacing-md);
        }

        .nav-item {
            margin-bottom: 2px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--text);
            border-left: 3px solid transparent;
            transition: var(--transition-fast);
        }

        .nav-link:hover {
            background-color: var(--primary-bg);
            border-left-color: var(--primary-light);
            color: var(--primary);
        }

        .nav-link.active {
            background-color: var(--primary-bg);
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 500;
        }

        .nav-link-inner {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            width: 24px;
        }

        .badge {
            background-color: var(--primary-bg);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .sidebar-close {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        /* ============= EKRAN POWITALNY ============= */
        .welcome-screen {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing);
            animation: fadeIn 0.6s ease;
        }

        .welcome-icon {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: var(--spacing-lg);
            animation: pulse 1.5s infinite alternate ease-in-out;
        }

        .welcome-title {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: var(--spacing);
            font-weight: 700;
        }

        .welcome-desc {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto var(--spacing-xl);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                opacity: 0.8;
            }
            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============= KARTY PRZEPISÓW ============= */
        .page-header {
            margin-bottom: var(--spacing-xl);
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        .page-title {
            font-size: 2rem;
            color: var(--text);
            margin-bottom: var(--spacing-xs);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .page-subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-md);
            animation: fadeIn 0.6s ease;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid var(--border);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: var(--primary-light);
        }

        .recipe-card-image {
            height: 180px;
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .recipe-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.4));
        }

        .recipe-card-category {
            position: absolute;
            top: var(--spacing);
            left: var(--spacing);
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow-sm);
        }

        .recipe-card-content {
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .recipe-card-title {
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            line-height: 1.4;
        }

        .recipe-meta {
            display: flex;
            gap: var(--spacing-md);
            color: var(--text-light);
            font-size: 0.875rem;
            margin-top: auto;
            padding-top: var(--spacing);
        }

        .recipe-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 768px) {
            .recipe-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .recipe-grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 1.75rem;
            }
        }

        /* ============= SZCZEGÓŁY PRZEPISU ============= */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-light);
            padding: var(--spacing-xs) var(--spacing-sm);
            cursor: pointer;
            margin-bottom: var(--spacing);
            transition: var(--transition-fast);
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .back-btn:hover {
            color: var(--primary);
            background-color: var(--primary-bg);
            transform: translateX(-3px);
        }

        .recipe-detail {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
            border: 1px solid var(--border);
        }

        .recipe-detail-header {
            background-color: var(--primary);
            color: white;
            padding: var(--spacing-xl);
            position: relative;
        }

        .recipe-detail-header-content {
            position: relative;
            z-index: 2;
        }

        .recipe-detail-title {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            line-height: 1.3;
        }

        .recipe-detail-category {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.875rem;
            margin-bottom: var(--spacing-md);
            backdrop-filter: blur(4px);
        }

        .recipe-detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .recipe-detail-meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            background-color: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }

        .recipe-detail-content {
            padding: var(--spacing-xl);
        }

        .recipe-section {
            margin-bottom: var(--spacing-xl);
        }

        .recipe-section-title {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: var(--spacing-md);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .recipe-section-title i {
            color: var(--primary);
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--spacing);
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing);
            background-color: var(--secondary);
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            border: 1px solid var(--border-light);
        }

        .ingredient-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--primary-light);
        }

        .ingredient-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background-color: var(--primary-bg);
            color: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .ingredient-amount {
            font-weight: 600;
            color: var(--primary);
        }

        .instructions-list {
            counter-reset: inst;
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
        }

        .instruction-item {
            position: relative;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 3.5rem;
            background-color: var(--secondary);
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            border: 1px solid var(--border-light);
        }

        .instruction-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--primary-light);
        }

        .instruction-item::before {
            counter-increment: inst;
            content: counter(inst);
            position: absolute;
            left: var(--spacing);
            top: var(--spacing);
            background-color: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .recipe-detail-header {
                padding: var(--spacing-lg);
            }

            .recipe-detail-title {
                font-size: 1.75rem;
            }

            .recipe-detail-content {
                padding: var(--spacing-lg);
            }

            .recipe-detail-meta {
                flex-direction: column;
                gap: var(--spacing-sm);
            }

            .ingredients-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============= WYNIKI WYSZUKIWANIA ============= */
        .search-results {
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        .results-group {
            margin-bottom: var(--spacing-xl);
        }

        .results-group-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: var(--spacing-md);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .search-result-item {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .search-result-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--primary-light);
        }

        .search-result-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .search-result-category {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--text-light);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-sm);
        }

        .match-highlight {
            color: var(--primary);
            background-color: var(--primary-bg);
            padding: 0 5px;
            border-radius: 3px;
            font-weight: 500;
        }

        .match-info {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: var(--spacing-xs);
            line-height: 1.6;
        }

        .match-reason {
            margin: var(--spacing-sm) 0;
            font-size: 0.875rem;
            color: var(--text-light);
            background-color: var(--secondary);
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }

        .search-info {
            background-color: var(--secondary);
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            margin-top: var(--spacing-sm);
            font-size: 0.875rem;
            color: var(--text-light);
            border: 1px solid var(--border-light);
        }

        .no-results {
            text-align: center;
            padding: var(--spacing-xl) 0;
            color: var(--text-light);
        }

        .no-results-icon {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-md);
        }

        .no-results-text {
            font-size: 1.25rem;
            margin-bottom: var(--spacing-sm);
        }

        /* ============= KOMPONENTY ============= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--primary-light);
        }

        .btn-large {
            padding: 16px 28px;
            font-size: 1.1rem;
            border-radius: var(--radius);
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
            background-color: var(--primary);
            border-color: var(--border);
        }

        /* ============= ANIMACJE ============= */
        .fade-in {
            animation: fadeIn 0.25s ease forwards;
        }

        .slide-in {
            animation: slideIn 0.3s ease forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in, .slide-in {
                animation: none !important;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============= SKROLOWALNA ZAWARTOŚĆ ============= */
        .scrollbar-styled {
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .scrollbar-styled::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .scrollbar-styled::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-styled::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 6px;
        }

        .scrollbar-styled::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-muted);
        }

        /* ============= LOADER ============= */
        .loader-container {
            display: block;
            min-height: 200px;
        }

        /* ============= POWIADOMIENIA ============= */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--card-bg);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .notification-icon {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .notification-message {
            font-size: 0.9rem;
            color: var(--text);
        }

        /* ============= PRZYPOMNIENIE O PRZEPISIE ============= */
        .recipe-reminder {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            z-index: 1000;
            max-width: 400px;
            animation: slideInUp 0.3s ease forwards;
            display: flex;
        }

        .recipe-reminder-content {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .recipe-reminder-icon {
            color: var(--accent);
            font-size: 1.25rem;
        }

        .recipe-reminder-message {
            font-size: 0.95rem;
            color: var(--text);
            flex-grow: 1;
            margin-bottom: 8px;
        }

        .recipe-reminder-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .recipe-reminder .btn-return,
        .recipe-reminder .btn-dismiss {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }

        .recipe-reminder .btn-return {
            background-color: var(--accent);
            color: white;
        }

        .recipe-reminder .btn-dismiss {
            background-color: var(--secondary);
            color: var(--text);
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============= ULUBIONE (gwiazdka) ============= */
        .favorite-btn {
            position: absolute;
            top: var(--spacing);
            right: var(--spacing);
            z-index: 3;
            width: 44px;
            height: 44px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition-fast);
            font-size: 1.2rem;
            box-shadow: var(--shadow-sm);
        }

        .favorite-btn:hover {
            transform: scale(1.08);
            color: #f9c80e;
            border-color: #f9c80e;
        }

        .favorite-btn.active {
            color: #f9c80e;
            border-color: #f9c80e;
        }

        .recipe-card-favorite {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            z-index: 2;
            transition: var(--transition-fast);
            font-size: 0.95rem;
        }

        .recipe-card-favorite:hover {
            transform: scale(1.1);
            color: #f9c80e;
        }

        .recipe-card-favorite.active {
            color: #f9c80e;
        }

        /* ============= SKALER PORCJI =============
           Dziedziczy bg/padding/radius/backdrop z .recipe-detail-meta-item,
           dzięki czemu wygląda jak pozostałe "pille" w czerwonym nagłówku */
        .servings-controls {
            gap: 8px !important;
        }

        .servings-controls .servings-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .servings-controls .servings-btn:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.05);
        }

        .servings-controls .servings-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .servings-controls input[type="number"] {
            width: 38px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 2px 0;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.05rem;
            -moz-appearance: textfield;
        }

        .servings-controls input[type="number"]:focus {
            outline: none;
            border-bottom-color: white;
        }

        .servings-controls input[type="number"]::-webkit-outer-spin-button,
        .servings-controls input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .servings-label {
            color: white;
            opacity: 0.9;
        }

        /* ============= PASEK AKCJI W DETALU ============= */
        .recipe-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            padding: var(--spacing) var(--spacing-xl);
            background: var(--primary-bg);
            border-bottom: 1px solid rgba(255, 107, 107, 0.18);
        }

        .recipe-actions .btn {
            flex: 1 1 auto;
            min-width: 140px;
        }

        @media (max-width: 768px) {
            .recipe-actions {
                padding: var(--spacing) var(--spacing-md);
            }
        }

        /* ============= CHECKBOX SKŁADNIKA ============= */
        .ingredient-item label {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            width: 100%;
        }

        .ingredient-check {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .ingredient-item.checked .ingredient-text {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .ingredient-item.checked {
            background: var(--border-light);
        }

        /* ============= FILTRY / SORT ============= */
        .sort-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing) var(--spacing-md);
            background: var(--secondary);
            border-radius: var(--radius-sm);
        }

        .sort-controls label {
            font-weight: 500;
            color: var(--text-light);
        }

        .select-wrap {
            position: relative;
            display: inline-block;
        }

        .select-wrap .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-light);
            font-size: 0.75rem;
            transition: var(--transition-fast);
        }

        .select-wrap select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 9px 36px 9px 14px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-fast);
            min-width: 200px;
        }

        .select-wrap select:hover {
            border-color: var(--primary-light);
        }

        .select-wrap select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .select-wrap select:focus + .select-arrow {
            color: var(--primary);
        }

        /* ============= LISTA ZAKUPÓW ============= */
        .shopping-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .shopping-group {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: var(--spacing);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .shopping-group-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) 0;
            border-bottom: 1px solid var(--border-light);
        }

        .shopping-item:last-child {
            border-bottom: none;
        }

        .shopping-item.checked .shopping-item-text {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .shopping-item-text {
            flex: 1;
        }

        .shopping-item-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
        }

        .shopping-item-remove:hover {
            color: var(--primary-dark);
            background: var(--primary-bg);
        }

        .shopping-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        /* ============= TRYB GOTOWANIA ============= */
        .cooking-mode {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        .cooking-mode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing) var(--spacing-md);
            border-bottom: 1px solid var(--border);
            background: var(--secondary);
        }

        .cooking-mode-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .cooking-mode-close {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 1.1rem;
        }

        .cooking-mode-close:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cooking-mode-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            text-align: center;
            overflow-y: auto;
        }

        .cooking-step-counter {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: var(--spacing);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .cooking-step-text {
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto var(--spacing-lg);
            color: var(--text);
        }

        .cooking-mode-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing);
            padding: var(--spacing-md);
            border-top: 1px solid var(--border);
            background: var(--secondary);
        }

        .cooking-progress {
            flex: 1;
            margin: 0 var(--spacing);
            height: 8px;
            background: var(--border-light);
            border-radius: 4px;
            overflow: hidden;
        }

        .cooking-progress-bar {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* ============= SKELETON LOADER ============= */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--spacing-md);
        }

        .skeleton-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .skeleton-block {
            background: linear-gradient(90deg, var(--border-light) 0%, var(--border) 50%, var(--border-light) 100%);
            background-size: 200% 100%;
            animation: skeletonPulse 1.4s ease-in-out infinite;
            border-radius: var(--radius-sm);
        }

        .skeleton-image {
            height: 160px;
            background: linear-gradient(90deg, var(--border-light) 0%, var(--border) 50%, var(--border-light) 100%);
            background-size: 200% 100%;
            animation: skeletonPulse 1.4s ease-in-out infinite;
        }

        .skeleton-content {
            padding: var(--spacing);
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, var(--border-light) 0%, var(--border) 50%, var(--border-light) 100%);
            background-size: 200% 100%;
            animation: skeletonPulse 1.4s ease-in-out infinite;
            border-radius: 4px;
            margin-bottom: var(--spacing-xs);
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }

        @keyframes skeletonPulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============= SKRÓTY KLAWISZOWE ============= */
        kbd {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Segoe UI', monospace;
            font-size: 0.85em;
            box-shadow: 0 1px 0 var(--border);
        }

        /* ============= STYLE WYDRUKU ============= */
        @media print {
            body {
                background: white;
                color: black;
            }

            .sidebar,
            .header,
            .notification,
            .recipe-reminder,
            .recipe-actions,
            .back-btn,
            .favorite-btn,
            .servings-controls .servings-btn,
            .ingredient-check,
            .cooking-mode {
                display: none !important;
            }

            .content-wrapper {
                margin-left: 0 !important;
            }

            .main-content {
                margin-top: 0 !important;
                padding: 0 !important;
            }

            .recipe-detail {
                box-shadow: none !important;
                border: none !important;
            }

            .recipe-detail-header {
                background: none !important;
                color: black !important;
                padding: 0 0 1rem 0 !important;
                border-bottom: 2px solid black !important;
            }

            .recipe-detail-title,
            .recipe-detail-category,
            .recipe-detail-meta,
            .recipe-section-title {
                color: black !important;
            }

            .ingredients-grid {
                display: block !important;
            }

            .ingredient-item {
                background: none !important;
                border: none !important;
                padding: 0.25rem 0 !important;
                page-break-inside: avoid;
            }

            .ingredient-amount {
                color: black !important;
            }

            .instruction-item {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>
<div class="app-container" id="appContainer">
    <!-- Panel boczny -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner scrollbar-styled">
            <div class="sidebar-header">
                <a href="#" class="logo" id="logo">
                    <i class="fas fa-utensils"></i>
                    <span>Książka Kucharska</span>
                </a>
                <button class="sidebar-close" id="sidebarClose" aria-label="Zamknij panel boczny">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-bolt"></i> Skróty
                </h3>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="shoppingListLink">
                            <span class="nav-link-inner">
                                <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                                <span>Lista zakupów</span>
                            </span>
                            <span class="badge" id="shoppingBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="favoritesLink">
                            <span class="nav-link-inner">
                                <span class="nav-icon"><i class="fas fa-star"></i></span>
                                <span>Ulubione</span>
                            </span>
                            <span class="badge" id="favoritesBadge">0</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-th-large"></i> Kategorie
                </h3>
                <ul class="nav-list" id="categoryList">
                    <!-- Kategorie zostaną dynamicznie dodane -->
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-star"></i> Ulubione
                </h3>
                <ul class="nav-list" id="favoritesList">
                    <!-- Ulubione przepisy -->
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-history"></i> Ostatnio przeglądane
                </h3>
                <ul class="nav-list" id="recentList">
                    <!-- Ostatnio przeglądane przepisy -->
                </ul>
            </div>
        </div>
    </aside>

    <!-- Główna treść -->
    <div class="content-wrapper" id="contentWrapper">
        <!-- Nagłówek z wyszukiwarką -->
        <header class="header" id="header">
            <div class="header-container">
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu">
                    <i class="fas fa-bars"></i>
                </button>

                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-box" id="searchInput" placeholder="Wyszukaj przepisy...">
                </div>

                <div class="header-actions">
                    <button class="header-btn" id="themeToggle" aria-label="Zmień motyw">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Główna zawartość strony -->
        <main class="main-content" id="mainContent">
            <div class="container">
                <!-- Skeleton loader podczas ładowania -->
                <div class="loader-container" id="loader">
                    <div class="skeleton-grid">
                        <div class="skeleton-card">
                            <div class="skeleton-image"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-line medium"></div>
                                <div class="skeleton-line short"></div>
                            </div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-image"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-line medium"></div>
                                <div class="skeleton-line short"></div>
                            </div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-image"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-line medium"></div>
                                <div class="skeleton-line short"></div>
                            </div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-image"></div>
                            <div class="skeleton-content">
